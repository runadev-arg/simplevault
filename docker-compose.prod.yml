name: simplevault

x-restart: &restart
  restart: unless-stopped

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    <<: [*restart, *security]
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_CHAIN_SECRET: ${SERVER_CHAIN_SECRET}
      SERVER_IP_HASH_SECRET: ${SERVER_IP_HASH_SECRET}
      SERVER_ARGON_SALT: ${SERVER_ARGON_SALT}
      SERVER_INVITE_SECRET: ${SERVER_INVITE_SECRET}
      SERVER_RECOVERY_HMAC_SECRET: ${SERVER_RECOVERY_HMAC_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      STEP_UP_TOKEN_TTL: ${STEP_UP_TOKEN_TTL:-120}
      SESSION_EPOCH_CACHE_TTL: ${SESSION_EPOCH_CACHE_TTL:-60}
      ARGON2_MEMORY_KIB: ${ARGON2_MEMORY_KIB:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GLOBAL_RATE_LIMIT: ${GLOBAL_RATE_LIMIT:-1000}
      LOGIN_IP_RATE_LIMIT: ${LOGIN_IP_RATE_LIMIT:-5}
      LOGIN_EMAIL_RATE_LIMIT: ${LOGIN_EMAIL_RATE_LIMIT:-10}
      SIGNUP_RATE_LIMIT: ${SIGNUP_RATE_LIMIT:-3}
      REFRESH_IP_RATE_LIMIT: ${REFRESH_IP_RATE_LIMIT:-60}
      LOGOUT_IP_RATE_LIMIT: ${LOGOUT_IP_RATE_LIMIT:-60}
      AUTH_PARAMS_RATE_LIMIT: ${AUTH_PARAMS_RATE_LIMIT:-100}
      INVITE_REDEEM_RATE_LIMIT: ${INVITE_REDEEM_RATE_LIMIT:-30}
      ME_RATE_LIMIT: ${ME_RATE_LIMIT:-100}
      TWOFA_REGISTER_RATE_LIMIT: ${TWOFA_REGISTER_RATE_LIMIT:-10}
      TWOFA_WEBAUTHN_AUTH_RATE_LIMIT: ${TWOFA_WEBAUTHN_AUTH_RATE_LIMIT:-30}
    mem_limit: 512m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal, dokploy-network]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    <<: [*restart, *security]
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      api: { condition: service_started }
    mem_limit: 512m
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [internal, dokploy-network]

networks:
  internal:
    driver: bridge
  dokploy-network:
    external: true
